[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
# Every run writes two reports into reports/ :
#   report.html = for people (open in a browser): pass/fail per test + the scores and reasons the tests print
#   junit.xml   = for CI (Azure DevOps reads it to show test results and history)
# --capture=tee-sys shows the prints in the terminal AND saves them into the reports (so -s is not needed)
addopts = --import-mode=importlib --capture=tee-sys
    --html=reports/report.html --self-contained-html
    --junitxml=reports/junit.xml
# Put each test's printed output into junit.xml too
junit_logging = system-out
markers =
    smoke: basic chatbot checks
    evaluation: DeepEval quality checks
    agentic: agent and tool checks
    performance: performance checks
